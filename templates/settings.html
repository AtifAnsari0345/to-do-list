{% extends "base.html" %}

{% block title %}Settings | Task Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-cog me-2"></i>User Settings</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('settings') }}">
                    <div class="mb-4">
                        <h5><i class="fas fa-user me-2"></i>Account Information</h5>
                        <div class="row mt-3">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" class="form-control" value="{{ user.username }}" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" value="{{ user.email }}" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h5><i class="fas fa-palette me-2"></i>Appearance</h5>
                        <div class="mt-3">
                            <label class="form-label">Theme</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="theme" id="lightTheme" value="light" 
                                           {% if user.theme == 'light' %}checked{% endif %}>
                                    <label class="form-check-label" for="lightTheme">
                                        <i class="fas fa-sun me-1"></i> Light
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="theme" id="darkTheme" value="dark" 
                                           {% if user.theme == 'dark' %}checked{% endif %}>
                                    <label class="form-check-label" for="darkTheme">
                                        <i class="fas fa-moon me-1"></i> Dark
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <h5><i class="fas fa-bell me-2"></i>Notifications</h5>
                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" name="notification_pref" id="notificationPref" 
                                   {% if user.notification_pref %}checked{% endif %}>
                            <label class="form-check-label" for="notificationPref">
                                Show upcoming task notifications on dashboard
                            </label>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Settings
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
